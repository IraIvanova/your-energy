<dialog
  class="exercise-modal"
  data-exercise-modal
  aria-label="Exercise actions"
>
  <button
    class="exercise-modal__close"
    type="button"
    aria-label="Close"
    data-modal-close
  >
    <load
      src="components/icon/icon.html"
      src-url="./images/icons/close.svg"
      label=""
    />
  </button>
  <p class="exercise-modal__title" data-modal-title>
    Save this exercise to your favorites?
  </p>
  <button
    class="ui-button exercise-modal__favorite"
    type="button"
    data-modal-favorite
  >
    Add to favorites
  </button>
</dialog>
