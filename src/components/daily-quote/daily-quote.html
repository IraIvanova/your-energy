<section
  class="daily-quote daily-quote--{=$variant}"
  aria-labelledby="{=$title-id}"
  aria-busy="true"
  data-daily-quote
>
  <img
    class="daily-quote__runner"
    src="./images/icons/quote-runner.svg"
    width="34"
    height="32"
    alt=""
  />
  <h2 class="daily-quote__title" id="{=$title-id}" tabindex="-1">
    Quote of the day
  </h2>
  <picture class="daily-quote__mark" aria-hidden="true">
    <source media="(min-width: 768px)" srcset="./images/icons/quote.svg" />
    <img src="./images/icons/quote-mobile.svg" width="20" height="20" alt="" />
  </picture>
  <div class="daily-quote__body">
    <div data-quote-content hidden>
      <blockquote class="daily-quote__text" data-quote-text></blockquote>
      <p class="daily-quote__author" data-quote-author></p>
    </div>
    <p class="daily-quote__status" role="status" data-quote-status>
      Loading quote…
    </p>
    <button class="daily-quote__retry" type="button" data-quote-retry hidden>
      Try again
    </button>
  </div>
</section>
