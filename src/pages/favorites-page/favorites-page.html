<section
  class="favorites-page"
  aria-labelledby="favorites-title"
  data-page="/favorites"
  hidden
>
  <h1
    class="favorites-page__title"
    id="favorites-title"
    data-title="Favorites."
  >
    Favorites
  </h1>
  <div class="favorites-page__layout">
    <aside class="favorites-page__sidebar">
      <div class="daily-quote" data-daily-quote>
        <div class="daily-quote__header">
          <span class="daily-quote__icon">
            <load
              src="components/icon/icon.html"
              src-url="./images/icons/quote-runner.svg"
              label=""
            />
          </span>
          <h2 class="daily-quote__title">Quote of the day</h2>
        </div>
        <span class="daily-quote__marks">
          <load
            src="components/icon/icon.html"
            src-url="./images/icons/quote.svg"
            label=""
          />
        </span>
        <div class="daily-quote__content">
          <blockquote class="daily-quote__text" data-quote-text></blockquote>
          <cite class="daily-quote__author" data-quote-author></cite>
        </div>
      </div>
      <div class="favorites-page__sidebar-bottom">
        <div class="favorites-page__norm">
          <load
            src="components/icon/icon.html"
            src-url="./images/icons/dumbbell.svg"
            label=""
          />
          <strong>110 min</strong>
          <span>Daily norm of sports</span>
        </div>
        <div
          class="favorites-page__photo"
          role="img"
          aria-label="People exercising"
        ></div>
      </div>
      <p class="favorites-page__error" data-quote-error hidden>
        We couldn't load today's quote.
      </p>
    </aside>
    <div class="favorites-scroll">
      <div class="favorites-page__content custom-scrollbar">
        <p class="favorites-page__empty" data-favorites-empty hidden>
          It appears that you haven't added any exercises to your favorites yet.
          To get started, add exercises you like from a category.
        </p>
        <p class="favorites-page__error" data-favorites-error hidden>
          We couldn't load your favorites. Please try again later.
        </p>
        <div class="exercise-grid" data-favorites-list></div>
        <template data-exercise-template>
          <load
            src="components/exercise-card/exercise-card.html"
            id=""
            title=""
            rating=""
            body-part=""
            target=""
            equipment=""
            burned-calories=""
          />
        </template>
      </div>
      <div
        class="custom-scrollbar__track"
        data-favorites-scrollbar
        aria-hidden="true"
      >
        <div
          class="custom-scrollbar__thumb"
          data-favorites-scrollbar-thumb
        ></div>
      </div>
    </div>
  </div>
</section>
